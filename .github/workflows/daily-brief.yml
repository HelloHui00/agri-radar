name: Daily Brief & Pages Update

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize directories
        run: |
          mkdir -p data logs output docs/archive
          ls -la

      - name: Run collector (with debug)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -x
          python scripts/collect.py > data/run_$(date +%Y%m%d_%H%M).jsonl
          ec=$?
          echo "collect.py exit-code: ${ec}"
          ls -la data/
          [ $ec -eq 0 ] || { echo "collect failed"; exit $ec; }
          test -s data/run_*.jsonl && echo "✓ collect produced output" || { echo "✗ collect empty"; exit 1; }
          python scripts/ingest.py data/run_*.jsonl
          echo "ingest exit: $?"

      - name: Generate brief (with debug)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -x
          python scripts/brief.py && echo "✓ brief generated" || echo "✗ brief failed"
          ls -la output/

      - name: Push to Feishu (optional, continue on failure)
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python scripts/feishu_push.py output/brief_$(date +%Y-%m-%d).md || true

      - name: Commit backfilled brief files (if any new)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/brief_*.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📄 brief $(date +%Y-%m-%d)"
          git pull --rebase || true
          git push || true

      - name: Generate HTML dashboard (with debug)
        run: |
          set -x
          python scripts/generate_pages.py
          ls -la docs/archive/ | head -20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v4
