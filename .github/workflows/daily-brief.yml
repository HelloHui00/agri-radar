name: Daily Brief & Pages Update

on:
  schedule:
    # 每天 00:00 北京时间 (UTC 16:00 前一天) 爬取全球信息
    # 北京 8-25 00:00 跑 → 抓取的是 8-24 00:00 ~ 8-25 00:00 这 24h 的内容
    # 产出的 brief 标日期为 8-24, Pages / 飞书在 8-25 早上查看
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize directories
        run: |
          mkdir -p data logs output docs/archive

      - name: Get content date
        id: today
        # 北京 00:00 = UTC 16:00 前一天, 此 step 跑时 UTC 仍是"内容采集日";
        # `date +%F` 就是采集日, brief/Pages 标题均以采集日标记日期
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Run collector
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python scripts/collect.py > data/run_$(date +%Y%m%d_%H%M).jsonl
          python scripts/ingest.py data/run_$(date +%Y%m%d_%H%M).jsonl

      - name: Generate brief
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/brief.py

      - name: Push to Feishu (optional, continue on failure)
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python scripts/feishu_push.py output/brief_$(date +%Y-%m-%d).md || true

      - name: Generate HTML dashboard
        run: python scripts/generate_pages.py

      # 原子 commit: AI outputs + Pages 一起提交
      - name: Commit all generated outputs (briefs + pages + db)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || echo "[info] rebase had conflicts, using current state"
          git add output/brief_*.md data/agri_radar.db docs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "[info] no new content, skip commit"
          else
            DATE=$(date +%Y-%m-%d)
            git commit -m "📄 $DATE daily brief + pages"
            git push origin main
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v4
