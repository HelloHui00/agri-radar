name: Daily Brief & Pages Update

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize directories
        run: |
          mkdir -p data logs output docs/archive
          ls -la

      - name: Run collector
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python scripts/collect.py > data/run_$(date +%Y%m%d_%H%M).jsonl
          python scripts/ingest.py data/run_$(date +%Y%m%d_%H%M).jsonl

      - name: Generate brief
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/brief.py

      - name: Push to Feishu (optional, continue on failure)
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python scripts/feishu_push.py output/brief_$(date +%Y-%m-%d).md || true

      - name: Generate HTML dashboard
        run: python scripts/generate_pages.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v4
