<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史简报归档 · 农业遥感情报中心</title>
<style>
/* ============ Design tokens ============ */
:root {
  --bg:               #fafbf9;
  --bg-elev:          #ffffff;
  --bg-tint:          #f0fdf4;
  --bg-tint-2:        #ecfdf5;
  --border:           #e2e8f0;
  --border-strong:    #cbd5e1;
  --text:             #0f172a;
  --text-2:           #334155;
  --text-3:           #64748b;
  --text-4:           #94a3b8;
  --accent:           #059669;
  --accent-strong:    #047857;
  --accent-soft:      #d1fae5;
  --accent-faint:     #ecfdf5;
  --link:             #059669;
  --link-hover:       #047857;
  --shadow-color:     5 150 105;
  --radius-card:      10px;
  --radius-chip:      999px;
  --radius-block:     6px;
  --font-display:     "Söhne Breit", "Cabinet Grotesk", "Inter Display",
                      -apple-system, BlinkMacSystemFont, "PingFang SC",
                      "Microsoft YaHei", sans-serif;
  --font-mono:        ui-monospace, "SF Mono", "JetBrains Mono",
                      Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:               #0b0f0c;
    --bg-elev:          #101613;
    --bg-tint:          #0e241a;
    --bg-tint-2:        #12291e;
    --border:           #1f2a24;
    --border-strong:    #2d3a33;
    --text:             #e6f0ea;
    --text-2:           #b7c9c0;
    --text-3:           #7d8f87;
    --text-4:           #4e5f57;
    --accent:           #34d399;
    --accent-strong:    #6ee7b7;
    --accent-soft:      #064e3b;
    --accent-faint:     #022c22;
    --link:             #34d399;
    --link-hover:       #6ee7b7;
    --shadow-color:     0 0 0;
  }
}

/* ============ Reset ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-display);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "tnum" 1, "cv11" 1;
  min-height: 100dvh;
}
::selection { background: var(--accent-soft); color: var(--accent-strong); }

/* ============ Header (Hero: eyebrow + title + date, max 3) ============ */
.site-head {
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  padding: 1.4rem 0 1.15rem;
}
.site-head-inner {
  max-width: 880px; margin: 0 auto; padding: 0 1.5rem;
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap;
}
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 0.35rem;
}
.site-head h1 {
  font-size: 1.45rem;
  font-weight: 650;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1.25;
}
.site-head .date {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-3);
  letter-spacing: 0.01em;
  padding-top: 0.4rem;
}

/* ============ Nav (single line, height cap 48px) ============ */
.nav {
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  padding: 0.55rem 0;
}
.nav-inner {
  max-width: 880px; margin: 0 auto; padding: 0 1.5rem;
  display: flex; gap: 1.4rem; align-items: center;
  overflow-x: auto; scrollbar-width: none;
}
.nav-inner::-webkit-scrollbar { display: none; }
.nav a {
  color: var(--text-3);
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 500;
  white-space: nowrap;
  border-bottom: 1px solid transparent;
  padding-bottom: 0.15rem;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.nav a:hover { color: var(--accent); border-bottom-color: var(--accent); }
.nav a.primary { color: var(--accent); font-weight: 600; }

/* ============ Main ============ */
.main { max-width: 880px; margin: 2rem auto 3rem; padding: 0 1.5rem; }

/* Stats bar (subtle, tinted shadow) */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  overflow: hidden;
  margin-bottom: 1.8rem;
}
.stat-item {
  background: var(--bg-elev);
  padding: 1rem 1.1rem 0.9rem;
  text-align: left;
}
.stat-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-4);
  margin-bottom: 0.35rem;
}
.stat-value {
  font-size: 1.6rem;
  font-weight: 630;
  color: var(--accent);
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}

/* ============ Content card ============ */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 2rem 2.2rem;
  box-shadow: 0 1px 2px rgba(var(--shadow-color) / 0.04),
              0 2px 8px rgba(var(--shadow-color) / 0.05);
}
@media (max-width: 640px) { .card { padding: 1.3rem 1.1rem; border-radius: 8px; } }

/* Section headers 【科研】 etc. - "chip" treatment, tinted accent */
h2 {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.95rem;
  font-weight: 650;
  letter-spacing: -0.005em;
  color: var(--accent-strong);
  background: var(--accent-faint);
  border: 1px solid var(--accent-soft);
  padding: 0.3rem 0.85rem 0.32rem;
  border-radius: var(--radius-chip);
  margin: 1.6rem 0 0.9rem;
}
h2::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}
h2:first-of-type { margin-top: 0.4rem; }

/* List items */
.num, .bullet { color: var(--accent); font-weight: 600; margin-right: 0.4rem; }
.num { font-variant-numeric: tabular-nums; }

/* Body text */
.card p { color: var(--text-2); margin-bottom: 0.85rem; max-width: 65ch; }
.card strong { color: var(--text); font-weight: 620; }

/* Links */
.card a {
  color: var(--link);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.card a:hover { color: var(--link-hover); border-bottom-color: var(--accent-soft); }

/* Divider */
hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 1.8rem 0;
}

/* Badge (use sparingly) */
.badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--accent-faint);
  color: var(--accent-strong);
  border: 1px solid var(--accent-soft);
  padding: 0.15rem 0.55rem 0.17rem;
  border-radius: var(--radius-chip);
  white-space: nowrap;
}

/* ============ Footer ============ */
.footer {
  text-align: center;
  color: var(--text-4);
  font-size: 0.78rem;
  padding: 2.5rem 1.5rem 3rem;
  border-top: 1px solid var(--border);
  margin-top: 3rem;
}
.footer p + p { margin-top: 0.3rem; }
.footer a { color: var(--text-3); text-decoration: none; border-bottom: 1px solid var(--border-strong); }
.footer a:hover { color: var(--accent); border-bottom-color: var(--accent); }
.footer .byline { font-weight: 500; color: var(--text-3); }
.footer .sources-line { color: var(--text-4); letter-spacing: 0.002em; line-height: 1.55; }

/* ============ Archive specific ============ */
.archive-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 0.9rem;
  margin-top: 0.9rem;
}
.archive-day {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-block);
  padding: 0.95rem 1rem 0.85rem;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
}
.archive-day:hover {
  border-color: var(--accent);
  box-shadow: 0 2px 12px rgba(var(--shadow-color) / 0.1);
}
.archive-date {
  font-weight: 630;
  color: var(--accent-strong);
  font-size: 0.92rem;
  letter-spacing: -0.005em;
  margin-bottom: 0.25rem;
}
.archive-meta { font-size: 0.78rem; color: var(--text-3); font-variant-numeric: tabular-nums; }

.month-header {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 2rem;
  margin-bottom: 0.6rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem;
}
.month-header .badge { transform: translateY(-1px); }

/* ============ Feedback card ============ */
.feedback-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 1.4rem 1.5rem 1.3rem;
  margin-top: 1.8rem;
  box-shadow: 0 1px 2px rgba(var(--shadow-color) / 0.04);
}
.fb-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 0.3rem;
}
.fb-title {
  font-size: 1.05rem;
  font-weight: 650;
  letter-spacing: -0.01em;
  color: var(--text);
  margin-bottom: 0.4rem;
}
.fb-desc {
  font-size: 0.85rem;
  color: var(--text-3);
  margin-bottom: 1rem;
  line-height: 1.6;
}
.fb-quick-row {
  display: flex; flex-wrap: wrap; gap: 0.45rem;
  margin-bottom: 0.9rem;
}
.fb-chip {
  padding: 0.28rem 0.75rem;
  border-radius: var(--radius-chip);
  border: 1px solid var(--accent-soft);
  background: var(--accent-faint);
  color: var(--accent-strong);
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
  white-space: nowrap;
}
.fb-chip:hover { background: var(--accent-soft); border-color: var(--accent); }
.fb-chip:active { transform: translateY(1px); }
.fb-textarea {
  width: 100%;
  min-height: 96px;
  font-family: var(--font-display);
  font-size: 0.9rem;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-block);
  padding: 0.65rem 0.85rem;
  resize: vertical;
  line-height: 1.6;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.fb-textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-faint);
}
.fb-actions {
  display: flex; gap: 0.6rem; align-items: center;
  margin-top: 0.85rem;
  flex-wrap: wrap;
}
.fb-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.5rem 1.05rem;
  border-radius: var(--radius-block);
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #ffffff;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
  text-decoration: none;
}
.fb-btn:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.fb-btn:active { transform: translateY(1px); }
.fb-btn.secondary {
  background: transparent;
  color: var(--accent);
  border-color: var(--border-strong);
}
.fb-btn.secondary:hover {
  background: var(--accent-faint);
  border-color: var(--accent);
  color: var(--accent-strong);
}
.fb-note {
  font-size: 0.72rem;
  color: var(--text-4);
  margin-top: 0.7rem;
  font-family: var(--font-mono);
}
.fb-status {
  font-size: 0.8rem;
  color: var(--accent-strong);
  margin-left: 0.4rem;
}

/* ============ Current prefs snapshot ============ */
.prefs-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 1rem 1.3rem;
  margin-bottom: 1.5rem;
  font-size: 0.85rem;
}
.prefs-title {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-4);
  font-family: var(--font-mono);
  margin-bottom: 0.55rem;
}
.prefs-row {
  display: flex; flex-wrap: wrap; gap: 0.4rem;
  align-items: center;
}
.prefs-row + .prefs-row { margin-top: 0.4rem; }
.prefs-tag {
  display: inline-block;
  padding: 0.15rem 0.6rem;
  border-radius: var(--radius-chip);
  font-size: 0.74rem;
  font-weight: 500;
  border: 1px solid var(--border-strong);
  color: var(--text-3);
  background: var(--bg);
  font-variant-numeric: tabular-nums;
}
.prefs-tag.like {
  border-color: var(--accent-soft);
  color: var(--accent-strong);
  background: var(--accent-faint);
}
.prefs-tag.dislike {
  border-color: #fecaca;
  color: #b91c1c;
  background: #fef2f2;
}
.prefs-tag.watch {
  border-color: #fde68a;
  color: #92400e;
  background: #fffbeb;
}
@media (prefers-color-scheme: dark) {
  .prefs-tag.dislike { border-color: #7f1d1d; color: #fca5a5; background: #450a0a; }
  .prefs-tag.watch   { border-color: #78350f; color: #fbbf24; background: #451a03; }
}

/* ============ Reduced motion ============ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}
</style>
